<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Amazing Box — Presentes que transformam momentos em Caicó</title>
  <meta name="description"
    content="Amazing Box — cestas de café da manhã e experiências especiais para presentear em Caicó e região.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --cream: #f7f2ea;
      --paper: #fffdf9;
      --ink: #2d2925;
      --muted: #746b62;
      --brown: #5b4435;
      --brown-hover: #433125;
      --gold: #b08a58;
      --line: #e5ddd2;
      --green: #25d366;
      --green-dark: #1eb954;
      --shadow: 0 14px 40px rgba(45, 41, 37, .08);
      --nav-bg: rgba(232, 198, 195, 0.94);
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5
    }

    h1,
    h2,
    h3,
    .serif {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400
    }

    a {
      text-decoration: none;
      color: inherit;
      transition: all .2s ease
    }

    .container {
      width: min(1120px, 92%);
      margin: auto
    }

    /* Navegação */
    .nav {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--nav-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(91, 68, 53, 0.15)
    }

    .nav-inner {
      height: 70px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
      grid-column: 2
    }

    .logo-img-nav {
      height: 36px;
      width: auto;
      object-fit: contain
    }

    .logo-text {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 16px;
      display: inline-block;
      text-align: center;
      color: var(--brown);
    }

    .logo-text small {
      display: block;
      font-family: 'Montserrat', sans-serif;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.22em;
      color: var(--brown);
      opacity: 0.85;
      margin-top: 1px;
    }

    .navlinks {
      display: flex;
      gap: 22px;
      font-size: 12px;
      color: var(--brown);
      grid-column: 1;
      font-weight: 500
    }

    .navlinks a:hover {
      opacity: 0.7
    }

    .nav-social {
      grid-column: 3;
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: bold;
      color: var(--brown);
      border: 1px solid var(--brown);
      padding: 6px 14px;
      border-radius: 999px;
      transition: all .2s ease;
      white-space: nowrap;
    }

    .nav-social:hover {
      background: var(--brown);
      color: #fff
    }

    .nav-social svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0
    }

    /* Hero Header */
    .hero {
      min-height: 500px;
      display: grid;
      place-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 20% 20%, #fffdf9 0, #f7f2ea 45%, #eee4d7 100%);
      padding: 40px 0
    }

    .hero:after {
      content: "";
      position: absolute;
      inset: 4%;
      border: 1px solid rgba(176, 138, 88, .28);
      pointer-events: none
    }

    .hero-logo {
      max-width: 220px;
      width: 100%;
      height: auto;
      margin: 0 auto 16px;
      display: block;
      object-fit: contain
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: .25em;
      color: var(--gold);
      text-transform: uppercase;
      font-weight: bold
    }

    .hero h1 {
      font-size: clamp(36px, 6vw, 60px);
      margin: 12px 0 8px;
      line-height: .98
    }

    .hero p {
      max-width: 540px;
      margin: 0 auto 22px;
      color: var(--muted);
      font-size: 15px
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap
    }

    .primary,
    .secondary {
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
      cursor: pointer;
      border: none
    }

    .primary {
      background: var(--brown);
      color: #fff
    }

    .primary:hover {
      background: var(--brown-hover)
    }

    .secondary {
      border: 1px solid var(--brown);
      color: var(--brown);
      background: transparent
    }

    .secondary:hover {
      background: var(--brown);
      color: #fff
    }

      padding: 60px 0
