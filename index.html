<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Cestas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f8f9fa;
      color: #333;
      padding: 15px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header h1 {
      font-size: 1.5rem;
      color: #2c3e50;
    }
    
    /* Grid de Cestas */
    .grid-cestas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      max-width: 800px;
      margin: 0 auto;
    }
    .card-cesta {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
    }
    .card-cesta img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
    }
    .card-info {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }
    .card-info h3 {
      font-size: 1rem;
      margin-bottom: 5px;
    }
    .card-info .preco {
      font-weight: bold;
      color: #e67e22;
      margin-bottom: 10px;
    }
    .btn-detalhes {
      background: #27ae60;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      justify-content: center;
      align-items: flex-end;
    }
    .modal-content {
      background: white;
      width: 100%;
      max-width: 500px;
      border-radius: 15px 15px 0 0;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .fechar-modal {
      float: right;
      font-size: 1.5rem;
      cursor: pointer;
      color: #888;
    }
    .modal-img {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .titulo-adicionais {
      font-size: 1rem;
      margin: 15px 0 10px 0;
      border-bottom: 1px solid #eee;
      padding-bottom: 5px;
    }

    /* Lista de Adicionais com Thumbnails */
    .adicional-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .adicional-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .adicional-thumb {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #e0e0e0;
    }
    .adicional-detalhes {
      display: flex;
      flex-direction: column;
    }
    .adicional-nome {
      font-weight: 600;
      font-size: 0.9rem;
    }
    .adicional-preco {
      font-size: 0.8rem;
      color: #666;
    }
    .adicional-checkbox {
      width: 20px;
      height: 20px;
      accent-color: #27ae60;
      cursor: pointer;
    }

    /* Rodapé do Modal */
    .modal-footer {
      margin-top: 20px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }
    .total-container {
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .btn-whatsapp {
      background: #25D366;
      color: white;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Nossas Cestas</h1>
  </header>

  <main class="grid-cestas">
    <!-- Cesta 1 -->
    <div class="card-cesta">
      <img src="cafe-cristal-m.jpg" alt="Café Cristal M" onerror="this.src='https://via.placeholder.com/300x400?text=Cesta+Cristal'">
      <div class="card-info">
        <h3>Café Cristal M</h3>
        <p class="preco">R$ 120,00</p>
        <button class="btn-detalhes" onclick="abrirModal('Café Cristal M', 120.00, 'cafe-cristal-m.jpg')">Monte a sua</button>
      </div>
    </div>

    <!-- Cesta 2 -->
    <div class="card-cesta">
      <img src="cafe-te-amo.jpg" alt="Café Te Amo" onerror="this.src='https://via.placeholder.com/300x400?text=Cesta+Te+Amo'">
      <div class="card-info">
        <h3>Café Te Amo</h3>
        <p class="preco">R$ 150,00</p>
        <button class="btn-detalhes" onclick="abrirModal('Café Te Amo', 150.00, 'cafe-te-amo.jpg')">Monte a sua</button>
      </div>
    </div>
  </main>

  <!-- Modal de Personalização -->
  <div id="modal-cesta" class="modal">
    <div class="modal-content">
      <span class="fechar-modal" onclick="fecharModal()">&times;</span>
      <h2 id="modal-titulo"></h2>
      <img id="modal-img" class="modal-img" src="" alt="Cesta Selecionada">

      <h3 class="titulo-adicionais">Adicionais Opcionais</h3>
      <div id="lista-adicionais"></div>

      <div class="modal-footer">
        <div class="total-container">
          <span>Total:</span>
          <span id="valor-total">R$ 0,00</span>
        </div>
        <button class="btn-whatsapp" onclick="enviarWhatsApp()">Pedir pelo WhatsApp</button>
      </div>
    </div>
  </div>

  <script>
    // Configuração dos Adicionais
    const adicionais = [
      { id: "caneca", nome: "Caneca", preco: 25.00, imagem: "adicional-caneca.jpg" },
      { id: "flores", nome: "Flores", preco: 35.00, imagem: "adicional-flores.jpg" },
      { id: "balao", nome: "Balão", preco: 15.00, imagem: "adicional-balao.jpg" }
    ];

    // Número do WhatsApp para envio (com código do país)
    const SEU_NUMERO_WHATSAPP = "5500000000000"; 

    let cestaSelecionada = {
      nome: "",
      precoBase: 0
    };

    function abrirModal(nome, preco, imagem) {
      cestaSelecionada.nome = nome;
      cestaSelecionada.precoBase = preco;

      document.getElementById("modal-titulo").innerText = nome;
      document.getElementById("modal-img").src = imagem;

      renderizarAdicionais();
      atualizarTotal();
      document.getElementById("modal-cesta").style.display = "flex";
    }

    function fecharModal() {
      document.getElementById("modal-cesta").style.display = "none";
    }

    function renderizarAdicionais() {
      const container = document.getElementById("lista-adicionais");
      container.innerHTML = "";

      adicionais.forEach(item => {
        const itemHtml = `
          <div class="adicional-item">
            <div class="adicional-info">
              <img src="${item.imagem}" alt="${item.nome}" class="adicional-thumb" onerror="this.src='https://via.placeholder.com/48?text=Foto'">
              <div class="adicional-detalhes">
                <span class="adicional-nome">${item.nome}</span>
                <span class="adicional-preco">+ R$ ${item.preco.toFixed(2).replace('.', ',')}</span>
              </div>
            </div>
            <input type="checkbox" class="adicional-checkbox" data-nome="${item.nome}" data-preco="${item.preco}" onchange="atualizarTotal()">
          </div>
        `;
        container.innerHTML += itemHtml;
      });
    }

    function atualizarTotal() {
      let total = cestaSelecionada.precoBase;
      const checkboxes = document.querySelectorAll('.adicional-checkbox:checked');

      checkboxes.forEach(cb => {
        total += parseFloat(cb.getAttribute('data-preco'));
      });

      document.getElementById("valor-total").innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
    }

    function enviarWhatsApp() {
      const checkboxes = document.querySelectorAll('.adicional-checkbox:checked');
      let listaAdicionais = [];
      let total = cestaSelecionada.precoBase;

      checkboxes.forEach(cb => {
        listaAdicionais.push(cb.getAttribute('data-nome'));
        total += parseFloat(cb.getAttribute('data-preco'));
      });

      let mensagem = `Olá! Gostaria de fazer o seguinte pedido:\n\n`;
      mensagem += `*Cesta:* ${cestaSelecionada.nome} (R$ ${cestaSelecionada.precoBase.toFixed(2).replace('.', ',')})\n`;

      if (listaAdicionais.length > 0) {
        mensagem += `*Adicionais:*\n- ${listaAdicionais.join('\n- ')}\n`;
      } else {
        mensagem += `*Adicionais:* Nenhum\n`;
      }

      mensagem += `\n*Total:* R$ ${total.toFixed(2).replace('.', ',')}`;

      const url = `https://wa.me/${SEU_NUMERO_WHATSAPP}?text=${encodeURIComponent(mensagem)}`;
      window.open(url, '_blank');
    }

    // Fechar modal ao clicar fora da caixa
    window.onclick = function(event) {
      const modal = document.getElementById("modal-cesta");
      if (event.target === modal) {
        fecharModal();
      }
    }
  </script>
</body>
</html>
